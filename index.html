<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>旅行 · Chinês para Viagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --ink: #1a1612; --paper: #f4ede0; --vermilion: #c8392e;
    --gold: #b8893e; --jade: #4a7856;
  }
  html, body {
    height: 100%; width: 100%; max-width: 100%;
    overflow: hidden; overscroll-behavior: none;
  }
  body {
    font-family: 'Cormorant Garamond', serif;
    background: var(--paper); color: var(--ink);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(184, 137, 62, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(200, 57, 46, 0.06) 0%, transparent 50%);
    user-select: none; -webkit-user-select: none;
  }
  .app {
    height: 100vh; height: 100dvh; display: flex; flex-direction: column;
    width: 100%; max-width: 520px; margin: 0 auto; position: relative;
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    padding: 14px 20px 10px; display: flex;
    justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(26, 22, 18, 0.08);
  }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand-cn {
    font-family: 'Noto Serif SC', serif; font-size: 24px;
    font-weight: 700; letter-spacing: 4px; color: var(--vermilion); line-height: 1;
  }
  .brand-sub {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    letter-spacing: 3px; text-transform: uppercase; color: var(--ink); opacity: 0.5;
  }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .stats { display: flex; gap: 14px; }
  .stat {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    cursor: pointer; padding: 4px 6px; border-radius: 4px;
    transition: background 0.15s;
  }
  .stat:active { background: rgba(26, 22, 18, 0.06); }
  .stat-num { font-size: 22px; font-family: 'Cormorant Garamond', serif; }
  .stat-likes .stat-num { color: var(--jade); }
  .stat-dislikes .stat-num { color: var(--vermilion); }
  .stat-label {
    font-family: 'JetBrains Mono', monospace; font-size: 8px;
    letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.5;
  }
  .menu-btn {
    width: 42px; height: 42px; border: 1px solid rgba(26,22,18,0.2);
    background: transparent; border-radius: 4px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 4px; padding: 8px;
  }
  .menu-btn span {
    display: block; width: 17px; height: 1.5px; background: var(--ink);
  }
  .progress { height: 2px; background: rgba(26, 22, 18, 0.08); margin: 0 20px; }
  .progress-fill { height: 100%; background: var(--vermilion); transition: width 0.3s; width: 0%; }
  .stage {
    flex: 1; min-width: 0; position: relative; display: flex;
    align-items: center; justify-content: center; padding: 12px 12px 8px; overflow: hidden;
  }
  .stage::after {
    content: '游'; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); font-family: 'Noto Serif SC', serif;
    font-size: min(320px, 78vw); color: var(--vermilion); opacity: 0.025;
    pointer-events: none; z-index: 0;
  }
  .card {
    width: 100%; height: 100%; max-width: 460px; max-height: 660px;
    position: relative; cursor: grab; touch-action: none; z-index: 1;
    transition: transform 0.4s cubic-bezier(0.4, 0.0, 0.2, 1);
  }
  .card.dragging { transition: none; cursor: grabbing; }
  .card.exit-right { animation: exitRight 0.5s cubic-bezier(0.4, 0.0, 0.2, 1) forwards; }
  .card.exit-left { animation: exitLeft 0.5s cubic-bezier(0.4, 0.0, 0.2, 1) forwards; }
  @keyframes exitRight { to { transform: translateX(150%) rotate(25deg); opacity: 0; } }
  @keyframes exitLeft { to { transform: translateX(-150%) rotate(-25deg); opacity: 0; } }
  .card.enter { animation: enterCard 0.4s cubic-bezier(0.4, 0.0, 0.2, 1); }
  @keyframes enterCard {
    from { transform: scale(0.92) translateY(20px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  .face {
    position: absolute; inset: 0; border-radius: 4px; overflow: hidden;
    display: flex; flex-direction: column;
    padding: clamp(18px, 5vw, 26px) clamp(16px, 4.5vw, 24px);
    box-shadow: 0 1px 2px rgba(26, 22, 18, 0.1), 0 12px 32px rgba(26, 22, 18, 0.18), 0 24px 60px rgba(26, 22, 18, 0.12);
    background: linear-gradient(180deg, #faf3e6 0%, #f4ede0 100%);
    border: 1px solid rgba(184, 137, 62, 0.2);
    transition: opacity 0.25s; align-items: center; justify-content: space-between;
  }
  .face.back {
    background: linear-gradient(180deg, #1a1612 0%, #2a221b 100%);
    color: var(--paper); border: 1px solid rgba(184, 137, 62, 0.3);
    opacity: 0; pointer-events: none;
  }
  .card.revealed .face.front { opacity: 0; pointer-events: none; }
  .card.revealed .face.back { opacity: 1; pointer-events: auto; }
  .corner { width: 100%; display: flex; justify-content: space-between; align-items: flex-start; }
  .corner-mark {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 2px; opacity: 0.4; text-transform: uppercase;
  }
  .face.back .corner-mark { color: var(--paper); opacity: 0.5; }
  .corner-stamp {
    width: 34px; height: 34px; border: 1.5px solid var(--vermilion);
    border-radius: 2px; display: flex; align-items: center; justify-content: center;
    font-family: 'Noto Serif SC', serif; font-size: 17px;
    color: var(--vermilion); transform: rotate(-3deg);
  }
  .face.back .corner-stamp { border-color: var(--gold); color: var(--gold); }
  .character {
    font-family: 'Noto Serif SC', serif; font-weight: 500;
    color: var(--ink); line-height: 1.05; text-align: center;
    flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px 0;
    max-width: 100%; overflow-wrap: anywhere; word-break: break-word;
  }
  .character[data-len="1"] { font-size: clamp(96px, 41vw, 190px); letter-spacing: -4px; }
  .character[data-len="2"] { font-size: clamp(72px, 28vw, 140px); }
  .character[data-len="3"] { font-size: clamp(52px, 24vw, 110px); }
  .character[data-len="4"] { font-size: clamp(42px, 18.5vw, 88px); }
  .character[data-len="5"] { font-size: clamp(34px, 15vw, 72px); }
  .character[data-len="6"] { font-size: clamp(28px, 12.3vw, 60px); }
  .character[data-len="7"] { font-size: clamp(25px, 10.8vw, 52px); }
  .character[data-len="8"] { font-size: clamp(22px, 9.2vw, 46px); }
  .character[data-len="9"] { font-size: clamp(20px, 8.2vw, 42px); }
  .front-pinyin {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: clamp(24px, 6.4vw, 34px); color: var(--gold); letter-spacing: 1px;
    text-align: center; padding: 0 12px;
    margin-top: -4px; margin-bottom: 4px;
    max-width: 100%; overflow-wrap: break-word;
  }
  .audio-btn {
    width: 48px; height: 48px; border-radius: 50%;
    border: 1.5px solid var(--gold);
    background: rgba(184, 137, 62, 0.1);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; color: var(--gold); font-size: 18px;
    margin: 8px auto 0;
  }
  .audio-btn:active { transform: scale(0.9); }
  .audio-btn.playing {
    background: var(--gold); color: var(--paper);
    animation: pulse 0.8s ease-in-out infinite;
  }
  .audio-btn.disabled { opacity: 0.3; cursor: not-allowed; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(184, 137, 62, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(184, 137, 62, 0); }
  }
  .face.back .audio-btn { background: rgba(184, 137, 62, 0.18); }
  .back-content {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    gap: 10px; text-align: center; padding: 6px 0;
    width: 100%; max-width: 100%; overflow-y: auto; overflow-x: hidden;
    overflow-wrap: break-word;
  }
  .pinyin {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: clamp(26px, 7vw, 36px); color: var(--gold); letter-spacing: 1px;
  }
  .divider { width: 36px; height: 1px; background: var(--gold); margin: 4px auto; opacity: 0.6; }
  .translation {
    font-family: 'Cormorant Garamond', serif; font-size: clamp(28px, 7.4vw, 40px);
    font-weight: 500; line-height: 1.2; padding: 0 8px; color: var(--paper);
  }
  .category {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 2px; text-transform: uppercase; color: var(--gold); opacity: 0.8;
  }
  .etymology {
    font-family: 'Cormorant Garamond', serif; font-size: clamp(15px, 4vw, 19px);
    font-style: italic; color: var(--paper); opacity: 0.78;
    line-height: 1.45; padding: 10px 12px; margin-top: 6px;
    border-top: 1px dashed rgba(184, 137, 62, 0.3);
    border-bottom: 1px dashed rgba(184, 137, 62, 0.3);
  }
  .etymology .han {
    font-family: 'Noto Serif SC', serif; font-style: normal;
    color: var(--gold); font-size: clamp(17px, 4.6vw, 22px); font-weight: 500;
  }
  .footer {
    width: 100%; text-align: center;
    border-top: 1px solid rgba(26, 22, 18, 0.1);
    padding-top: 12px; margin-top: 8px;
  }
  .face.back .footer { border-top-color: rgba(244, 237, 224, 0.15); }
  .hint {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 2.5px; text-transform: uppercase; opacity: 0.45;
  }
  .indicator {
    position: absolute; top: 24px; padding: 6px 14px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    letter-spacing: 3px; text-transform: uppercase;
    border: 2px solid; border-radius: 2px; opacity: 0;
    transition: opacity 0.15s; pointer-events: none; font-weight: 700; z-index: 2;
  }
  .indicator.like { right: 24px; color: var(--jade); border-color: var(--jade); transform: rotate(12deg); }
  .indicator.dislike { left: 24px; color: var(--vermilion); border-color: var(--vermilion); transform: rotate(-12deg); }
  .controls {
    padding: 14px 24px 18px; display: flex; justify-content: center;
    align-items: center; gap: clamp(28px, 9vw, 44px);
    border-top: 1px solid rgba(26, 22, 18, 0.08);
  }
  .btn {
    width: clamp(64px, 17vw, 74px); height: clamp(64px, 17vw, 74px);
    border-radius: 50%; border: 1.5px solid;
    background: var(--paper); cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    transition: transform 0.15s; font-size: 26px;
  }
  .btn:active { transform: scale(0.92); }
  .btn-dislike { border-color: var(--vermilion); color: var(--vermilion); }
  .btn-like { border-color: var(--jade); color: var(--jade); }
  .btn-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .btn-label {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.5;
  }
  .done {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 40px; text-align: center; background: var(--paper); z-index: 10;
  }
  .done.active { display: flex; }
  .done-char { font-family: 'Noto Serif SC', serif; font-size: clamp(84px, 26vw, 120px); color: var(--vermilion); margin-bottom: 12px; }
  .done-title { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 32px; margin-bottom: 8px; }
  .done-sub {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 2px; opacity: 0.5; text-transform: uppercase; margin-bottom: 24px;
  }
  .done-stats { display: flex; gap: 40px; margin-bottom: 28px; }
  .done-stat-num { font-family: 'Cormorant Garamond', serif; font-size: 48px; line-height: 1; }
  .done-stat-num.jade { color: var(--jade); }
  .done-stat-num.verm { color: var(--vermilion); }
  .done-stat-label {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    letter-spacing: 2px; text-transform: uppercase; opacity: 0.5; margin-top: 6px;
  }
  .done-buttons { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; }
  .restart, .review-btn, .all-btn {
    border: none; padding: 17px 32px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    cursor: pointer; border-radius: 2px;
  }
  .restart { background: var(--ink); color: var(--paper); }
  .review-btn { background: var(--vermilion); color: var(--paper); }
  .all-btn { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }

  @media (max-height: 700px) {
    header { padding: 10px 20px 8px; }
    .brand-cn { font-size: 20px; }
    .controls { padding: 10px 24px 14px; }
    .btn { width: 58px; height: 58px; font-size: 23px; }
    .audio-btn { width: 42px; height: 42px; font-size: 16px; margin-top: 4px; }
  }

  /* Panel (lista de palavras) */
  .panel {
    position: absolute; inset: 0; background: var(--paper);
    z-index: 20; display: none; flex-direction: column;
  }
  .panel.active { display: flex; }
  .panel-header {
    padding: 18px 24px 12px; display: flex; align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(26, 22, 18, 0.08);
  }
  .panel-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 20px; color: var(--vermilion);
    font-weight: 700; letter-spacing: 2px;
  }
  .close-btn {
    width: 32px; height: 32px; border: 1px solid rgba(26,22,18,0.2);
    background: transparent; border-radius: 4px; cursor: pointer;
    font-size: 16px; display: flex; align-items: center; justify-content: center;
    color: var(--ink);
  }
  .tabs {
    display: flex; padding: 0 24px; gap: 0;
    border-bottom: 1px solid rgba(26, 22, 18, 0.08);
  }
  .tab {
    flex: 1; padding: 16px 8px; background: transparent; border: none;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
    color: var(--ink); opacity: 0.5; position: relative;
    transition: opacity 0.2s;
  }
  .tab.active { opacity: 1; }
  .tab.active::after {
    content: ''; position: absolute; bottom: -1px; left: 50%;
    transform: translateX(-50%); width: 60%; height: 2px;
    background: var(--vermilion);
  }
  .tab-count { font-size: 9px; opacity: 0.6; margin-left: 4px; }
  [hidden] { display: none !important; }
  /* Grelha de areas: tudo visivel de uma vez, sem rolagem lateral. */
  .area-grid {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    display: grid; gap: 12px; padding: 16px;
    grid-template-columns: repeat(auto-fill, minmax(min(42vw, 230px), 1fr));
    align-content: start;
  }
  .area-card {
    position: relative; overflow: hidden; text-align: left;
    border: 1px solid rgba(184, 137, 62, 0.3); border-radius: 4px;
    background: linear-gradient(180deg, #faf3e6 0%, #f4ede0 100%);
    padding: 16px 14px 14px; cursor: pointer; color: var(--ink);
    display: flex; flex-direction: column; gap: 6px; min-height: 112px;
    transition: transform 0.12s;
  }
  .area-card:active { transform: scale(0.97); }
  .area-card.all {
    grid-column: 1 / -1; min-height: 86px;
    background: linear-gradient(180deg, #1a1612 0%, #2a221b 100%);
    color: var(--paper); border-color: var(--ink);
  }
  .area-han {
    position: absolute; right: -4px; bottom: -16px;
    font-family: 'Noto Serif SC', serif; font-size: 58px; line-height: 1;
    color: var(--vermilion); opacity: 0.1; pointer-events: none;
  }
  .area-card.all .area-han { color: var(--gold); opacity: 0.25; }
  .area-name {
    font-family: 'Cormorant Garamond', serif; font-size: 21px;
    font-weight: 600; line-height: 1.1; position: relative;
  }
  .area-count {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.55;
    position: relative;
  }
  .area-bar {
    height: 3px; border-radius: 2px; margin-top: auto;
    background: rgba(26, 22, 18, 0.12); position: relative;
  }
  .area-card.all .area-bar { background: rgba(244, 237, 224, 0.22); }
  .area-bar > i { display: block; height: 100%; border-radius: 2px; background: var(--jade); }
  .list-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .area-card.quiz-entry {
    background: linear-gradient(180deg, #c8392e 0%, #a82e25 100%);
    color: var(--paper); border-color: #a82e25; min-height: 92px;
  }
  .area-card.quiz-entry .area-han { color: var(--paper); opacity: 0.22; }
  .quiz {
    position: absolute; inset: 0; background: var(--paper);
    z-index: 30; display: none; flex-direction: column;
  }
  .quiz.active { display: flex; }
  .quiz-bar { height: 3px; background: rgba(26,22,18,0.1); }
  .quiz-bar > i { display: block; height: 100%; width: 0; background: var(--vermilion); transition: width .3s; }
  .quiz-body { flex: 1; display: flex; flex-direction: column; padding: 20px; min-height: 0; overflow-y: auto; }
  .quiz-step {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 2px; text-transform: uppercase; opacity: .5; text-align: center;
  }
  .quiz-ask {
    flex: 0 0 auto; text-align: center; padding: 22px 6px 18px;
  }
  .quiz-ask-han { font-family: 'Noto Serif SC', serif; font-size: clamp(44px, 15vw, 88px); line-height: 1.1; }
  .quiz-ask-pin { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(18px, 5vw, 26px); color: var(--gold); margin-top: 6px; }
  .quiz-ask-pt { font-family: 'Cormorant Garamond', serif; font-size: clamp(26px, 7vw, 40px); font-weight: 500; line-height: 1.15; }
  .quiz-opts { display: flex; flex-direction: column; gap: 10px; }
  .quiz-opt {
    width: 100%; text-align: left; padding: 16px 18px; border-radius: 4px;
    border: 1px solid rgba(26,22,18,0.2); background: #faf3e6; cursor: pointer;
    font-family: 'Cormorant Garamond', serif; font-size: clamp(19px, 5vw, 26px);
    color: var(--ink); line-height: 1.2;
  }
  .quiz-opt .han { font-family: 'Noto Serif SC', serif; font-size: 1.25em; }
  .quiz-opt.right { background: var(--jade); color: var(--paper); border-color: var(--jade); }
  .quiz-opt.wrong { background: var(--vermilion); color: var(--paper); border-color: var(--vermilion); }
  .quiz-opt:disabled { cursor: default; }
  .quiz-result { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 24px; text-align: center; }
  .quiz-score { font-family: 'Cormorant Garamond', serif; font-size: 64px; line-height: 1; }
  .quiz-verdict { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 26px; margin: 14px 0 6px; }
  .quiz-detail { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1px; opacity: .6; margin-bottom: 26px; }
  .quiz-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; }
  .quiz-actions button {
    padding: 16px; border-radius: 2px; cursor: pointer;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 2px; text-transform: uppercase; border: 1.5px solid var(--ink);
    background: transparent; color: var(--ink);
  }
  .quiz-actions button.primary { background: var(--ink); color: var(--paper); }
  .back-btn {
    width: 36px; height: 36px; border: 1px solid rgba(26,22,18,0.2);
    background: transparent; border-radius: 4px; cursor: pointer;
    font-size: 16px; display: flex; align-items: center; justify-content: center;
    color: var(--ink); flex-shrink: 0; margin-right: 10px;
  }
  .panel-title { flex: 1; min-width: 0; }
  .panel-content { flex: 1; overflow-y: auto; padding: 8px 0; }
  .word-row {
    display: flex; align-items: center; padding: 16px 24px;
    border-bottom: 1px solid rgba(26, 22, 18, 0.06);
    gap: 14px; cursor: pointer; transition: background 0.15s;
  }
  .word-row:active { background: rgba(26, 22, 18, 0.04); }
  .word-hanzi {
    font-family: 'Noto Serif SC', serif; font-size: 28px;
    font-weight: 500; color: var(--ink);
    min-width: 84px; flex-shrink: 0;
  }
  .word-info { flex: 1; min-width: 0; }
  .word-pinyin {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    color: var(--gold); font-size: 16px; margin-bottom: 3px;
  }
  .word-pt {
    font-family: 'Cormorant Garamond', serif; font-size: 18px;
    color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .word-audio {
    width: 42px; height: 42px; border-radius: 50%;

  }

  }
  .panel-footer button.danger { color: var(--vermilion); border-color: var(--vermilion); }
  /* ---------------------------------------------------------------
     Escala independente do viewport.

     Alguns navegadores (modo desktop, WebView de apps) ignoram o
     meta viewport e montam a pagina com 980px de largura. Ai o cap
     em px deixava a carta com 47% da tela. Em telas de toque os
     limites passam a ser relativos, e a tipografia e medida em
     fracao da propria carta (cqmin), entao a proporcao se mantem
     qualquer que seja a largura logica da pagina.
     --------------------------------------------------------------- */
  @media (pointer: coarse), (max-width: 1100px) {
    .app { max-width: 100%; }
    .card { max-width: 92vw; max-height: 86vh; }
    .btn { width: min(16vw, 110px); height: min(16vw, 110px); font-size: min(6vw, 38px); }
    .audio-btn { width: min(12vw, 66px); height: min(12vw, 66px); font-size: min(4.5vw, 24px); }

    .brand-sub { font-size: min(2.4vw, 13px); }

    .btn-label { font-size: min(2.3vw, 13px); }

    .area-name { font-size: min(4.4vw, 26px); }

  }

  @supports (container-type: size) {
    .card { container-type: size; }
    .corner-mark { font-size: 2.8cqmin; }

<div class="app">
  <header>

  <div class="stage">

      <div class="indicator dislike">Revisar</div>
      <div class="face front">
        <div class="corner">

        <div class="footer"><div class="hint">Toque para ver tradução</div></div>
      </div>
      <div class="face back">
        <div class="corner">
          <div class="corner-mark" id="cardNumBack">№ 01</div>
          <div class="corner-stamp">译</div>
        </div>
        <div class="back-content">
          <div class="category" id="category">Saudação</div>
          <div class="pinyin" id="pinyin">nǐ hǎo</div>
          <button class="audio-btn" id="audioBtnBack" aria-label="Ouvir">♪</button>
          <div class="divider"></div>
          <div class="translation" id="translation">olá</div>
          <div class="etymology" id="etymology"></div>
        </div>
        <div class="footer"><div class="hint">← Revisar · Sei →</div></div>
      </div>
    </div>
    <div class="done" id="done">
      <div class="done-char">到</div>
      <div class="done-title">完成了</div>
      <div class="done-sub">Sessão concluída</div>
      <div class="done-stats">
        <div><div class="done-stat-num jade" id="finalLikes">0</div><div class="done-stat-label">Acertos</div></div>
        <div><div class="done-stat-num verm" id="finalDislikes">0</div><div class="done-stat-label">Revisar</div></div>
      </div>
      <div class="done-buttons">
        <button class="review-btn" id="reviewOnly">Treinar só os de revisar</button>
        <button class="all-btn" id="restart">Recomeçar com todas</button>
      </div>
    </div>
  </div>
  <div class="controls">
    <div class="btn-wrap"><button class="btn btn-dislike" id="btnDislike">✕</button><span class="btn-label">Revisar</span></div>
    <div class="btn-wrap"><button class="btn btn-like" id="btnLike">✓</button><span class="btn-label">Sei</span></div>
  </div>

  <!-- Panel: lista de palavras -->
  <div class="panel" id="panel">
    <div class="panel-header">
      <button class="back-btn" id="backToAreas" aria-label="Voltar" hidden>←</button>
      <div class="panel-title" id="panelTitle">词汇 · Áreas</div>
      <button class="close-btn" id="closePanel">✕</button>
    </div>
    <div class="area-grid" id="areaGrid"></div>
    <div class="quiz" id="quiz">
      <div class="panel-header">
        <div class="panel-title" id="quizTitle">Teste</div>
        <button class="close-btn" id="closeQuiz" aria-label="Fechar">✕</button>
      </div>
      <div class="quiz-bar"><i id="quizBar"></i></div>
      <div class="quiz-body" id="quizBody"></div>
      <div class="quiz-result" id="quizResult" hidden></div>
    </div>
    <div class="list-view" id="listView" hidden>
      <div class="tabs">
        <button class="tab" data-tab="know">Sei <span class="tab-count" id="countKnow">0</span></button>
        <button class="tab" data-tab="review">Revisar <span class="tab-count" id="countReview">0</span></button>
        <button class="tab active" data-tab="all">Todas <span class="tab-count" id="countAll">0</span></button>
      </div>
      <div class="panel-content" id="panelContent"></div>
      <div class="panel-footer">
        <button id="trainSelected">Treinar esta lista</button>
        <button class="danger" id="resetProgress">Limpar progresso</button>
      </div>
    </div>
  </div>
</div>

  // ─── localStorage (progresso persistente) ───
  const STORAGE_KEY = 'iori-chinese-progress-v1';
  // status: { [hanzi]: 'know' | 'review' }
  let progress = {};
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) progress = JSON.parse(saved);
  } catch (e) { progress = {}; }

  function saveProgress() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }
    catch (e) { /* ignore */ }
  }

  function markCard(hanzi, status) {
    progress[hanzi] = status;
    saveProgress();
  }

  // ─── Shuffle ───
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  let cards = shuffle(deck);
  let index = 0, likes = 0, dislikes = 0;

  // ─── DOM refs ───
  const card = document.getElementById('card');
  const charEl = document.getElementById('char');
  const frontPinyinEl = document.getElementById('frontPinyin');
  const pinyinEl = document.getElementById('pinyin');
  const translationEl = document.getElementById('translation');
  const categoryEl = document.getElementById('category');
  const etymologyEl = document.getElementById('etymology');
  const cardNumEl = document.getElementById('cardNum');
  const cardNumBackEl = document.getElementById('cardNumBack');
  const likesEl = document.getElementById('likes');
  const dislikesEl = document.getElementById('dislikes');
  const progressEl = document.getElementById('progress');
  const doneEl = document.getElementById('done');
  const indicatorLike = document.querySelector('.indicator.like');
  const indicatorDislike = document.querySelector('.indicator.dislike');
  const audioBtnFront = document.getElementById('audioBtnFront');
  const audioBtnBack = document.getElementById('audioBtnBack');

  // ─── Web Speech API (com feature detection) ───
  const hasSpeech = typeof window !== 'undefined'
    && 'speechSynthesis' in window
    && 'SpeechSynthesisUtterance' in window;
  let zhVoice = null;
  let voicesReady = false;
  let speechWarmedUp = false;

  function loadVoices() {
    if (!hasSpeech) return false;
    try {
      const voices = window.speechSynthesis.getVoices();
      if (!voices || voices.length === 0) return false;
      // Preferência: voz feminina chinesa > qualquer zh-CN > qualquer zh
      zhVoice = voices.find(v => /zh[-_]?CN/i.test(v.lang) && /Tingting|Mei-Jia|Sin-ji|female|女/i.test(v.name))
             || voices.find(v => /zh[-_]?CN/i.test(v.lang))
             || voices.find(v => /^zh/i.test(v.lang))
             || voices.find(v => /chinese|mandarin/i.test(v.name));
      voicesReady = true;
      return true;
    } catch (err) { return false; }
  }

  if (hasSpeech) {
    loadVoices();
    try {
      if (window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }
    } catch (err) {}
  } else {
    if (audioBtnFront) audioBtnFront.classList.add('disabled');
    if (audioBtnBack) audioBtnBack.classList.add('disabled');
  }

  // iOS Safari precisa de uma "ativação" via gesto do usuário antes de falar.
  // Falamos uma string vazia no primeiro toque pra desbloquear o áudio.
  function warmUpSpeech() {
    if (!hasSpeech || speechWarmedUp) return;
    try {
      const warmup = new SpeechSynthesisUtterance(' ');
      warmup.volume = 0;
      warmup.rate = 1;
      window.speechSynthesis.speak(warmup);
      speechWarmedUp = true;
    } catch (err) {}
  }

  function speak(text, btn) {
    if (!hasSpeech) {
      alert('Seu navegador não tem suporte a síntese de voz em mandarim. Tente Safari (iPhone) ou Chrome (Android).');
      return;
    }

    // Garante voices carregadas (em alguns navegadores carrega tarde)
    if (!voicesReady) loadVoices();

    try {
      // Cancela qualquer fala em andamento
      window.speechSynthesis.cancel();

      // Pequeno delay ajuda no iOS após o cancel
      setTimeout(() => {
        try {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'zh-CN';
          if (zhVoice) u.voice = zhVoice;
          u.rate = 0.85;
          u.pitch = 1;
          u.volume = 1;
          const buttons = btn ? [btn] : [audioBtnFront, audioBtnBack];
          buttons.forEach(b => b && b.classList.add('playing'));
          u.onend = () => buttons.forEach(b => b && b.classList.remove('playing'));
          u.onerror = (e) => {
            buttons.forEach(b => b && b.classList.remove('playing'));
            console.warn('Speech error:', e);
          };
          window.speechSynthesis.speak(u);

          // Workaround para iOS: às vezes pausa sozinho
          setTimeout(() => {
            if (window.speechSynthesis.paused) window.speechSynthesis.resume();
          }, 100);
        } catch (err) {
          if (btn) btn.classList.remove('playing');
        }
      }, 50);
    } catch (err) {
      if (btn) btn.classList.remove('playing');
    }
  }

  function playCurrent(e) {
    if (e) { e.stopPropagation(); e.preventDefault(); }
    warmUpSpeech();
    if (index < cards.length) speak(cards[index].hanzi);
  }

  // Listeners para touch e click — touch responde mais rápido no mobile
  audioBtnFront.addEventListener('click', playCurrent);
  audioBtnBack.addEventListener('click', playCurrent);
  audioBtnFront.addEventListener('touchend', playCurrent);
  audioBtnBack.addEventListener('touchend', playCurrent);

  // Warm-up no primeiro toque em qualquer lugar do app (para iOS)
  document.addEventListener('touchstart', warmUpSpeech, { once: true, passive: true });
  document.addEventListener('click', warmUpSpeech, { once: true });

  // ─── Render ───
  function pad(n) { return String(n).padStart(2, '0'); }

  function render() {
    if (index >= cards.length) { finish(); return; }
    const c = cards[index];
    card.classList.remove('revealed');
    setTimeout(() => {
      charEl.textContent = c.hanzi;
      charEl.setAttribute('data-len', Math.min(c.hanzi.length, 9));
      frontPinyinEl.textContent = c.pinyin;
      pinyinEl.textContent = c.pinyin;
      translationEl.textContent = c.pt;
      categoryEl.textContent = c.cat;
      if (c.etym) {
        etymologyEl.innerHTML = c.etym;
        etymologyEl.style.display = 'block';
      } else {
        etymologyEl.style.display = 'none';
      }
      cardNumEl.textContent = '\u2116 ' + pad(index + 1) + ' / ' + pad(cards.length);
      cardNumBackEl.textContent = cardNumEl.textContent;
      progressEl.style.width = ((index / cards.length) * 100) + '%';
      card.classList.add('enter');
      setTimeout(() => card.classList.remove('enter'), 400);
    }, 50);
  }

  function updateStats() {
    likesEl.textContent = likes;
    dislikesEl.textContent = dislikes;
  }

  function nextCard(direction) {
    if (hasSpeech) {
      try { window.speechSynthesis.cancel(); } catch (err) {}
    }
    audioBtnFront.classList.remove('playing');
    audioBtnBack.classList.remove('playing');
    const currentHanzi = cards[index].hanzi;
    if (direction === 'right') {
      likes++;
      markCard(currentHanzi, 'know');
      card.classList.add('exit-right');
    } else {
      dislikes++;
      markCard(currentHanzi, 'review');
      card.classList.add('exit-left');
    }
    updateStats();
    setTimeout(() => {
      card.classList.remove('exit-right', 'exit-left');
      card.style.transform = '';
      indicatorLike.style.opacity = 0;
      indicatorDislike.style.opacity = 0;
      index++;
      render();
    }, 500);
  }

  function finish() {
    progressEl.style.width = '100%';
    document.getElementById('finalLikes').textContent = likes;
    document.getElementById('finalDislikes').textContent = dislikes;
    doneEl.classList.add('active');
  }

  card.addEventListener('click', () => {
    if (!dragHappened) card.classList.toggle('revealed');
  });

  document.getElementById('btnLike').addEventListener('click', () => nextCard('right'));
  document.getElementById('btnDislike').addEventListener('click', () => nextCard('left'));

  function startSession(cardList) {
    cards = shuffle(cardList);
    index = 0; likes = 0; dislikes = 0;
    updateStats();
    doneEl.classList.remove('active');
    render();
  }

  document.getElementById('restart').addEventListener('click', () => {
    startSession(deck);
  });

  document.getElementById('reviewOnly').addEventListener('click', () => {
    const reviewCards = deck.filter(c => progress[c.hanzi] === 'review');
    if (reviewCards.length === 0) {
      startSession(deck);
    } else {
      startSession(reviewCards);
    }
  });

  // ─── Drag ───
  let startX = 0, startY = 0, currentX = 0, currentY = 0;
  let isDragging = false, dragHappened = false;

  function onStart(e) {
    if (card.classList.contains('exit-right') || card.classList.contains('exit-left')) return;
    isDragging = true;
    dragHappened = false;
    const point = e.touches ? e.touches[0] : e;
    startX = point.clientX;
    startY = point.clientY;
    card.classList.add('dragging');
  }

  function onMove(e) {
    if (!isDragging) return;
    const point = e.touches ? e.touches[0] : e;
    currentX = point.clientX - startX;
    currentY = point.clientY - startY;
    if (Math.abs(currentX) > 5 || Math.abs(currentY) > 5) dragHappened = true;
    const rotation = currentX * 0.08;
    card.style.transform = 'translate(' + currentX + 'px, ' + (currentY * 0.3) + 'px) rotate(' + rotation + 'deg)';
    if (currentX > 40) {
      indicatorLike.style.opacity = Math.min(currentX / 120, 1);
      indicatorDislike.style.opacity = 0;
    } else if (currentX < -40) {
      indicatorDislike.style.opacity = Math.min(-currentX / 120, 1);
      indicatorLike.style.opacity = 0;
    } else {
      indicatorLike.style.opacity = 0;
      indicatorDislike.style.opacity = 0;
    }
  }

  function onEnd() {
    if (!isDragging) return;
    isDragging = false;
    card.classList.remove('dragging');
    const threshold = 100;
    if (currentX > threshold) nextCard('right');
    else if (currentX < -threshold) nextCard('left');
    else {
      card.style.transform = '';
      indicatorLike.style.opacity = 0;
      indicatorDislike.style.opacity = 0;
    }
    currentX = 0; currentY = 0;
    setTimeout(() => { dragHappened = false; }, 50);
  }

  card.addEventListener('mousedown', onStart);
  card.addEventListener('touchstart', onStart, { passive: true });
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, { passive: true });
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchend', onEnd);

  document.addEventListener('keydown', (e) => {
    if (panel.classList.contains('active')) return;
    if (e.key === 'ArrowRight') nextCard('right');
    else if (e.key === 'ArrowLeft') nextCard('left');
    else if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      card.classList.toggle('revealed');
    }
  });

  // ─── Panel (lista de palavras) ───
  const panel = document.getElementById('panel');
  const panelContent = document.getElementById('panelContent');
  const panelTitle = document.getElementById('panelTitle');
  const areaGrid = document.getElementById('areaGrid');
  const listView = document.getElementById('listView');
  const backBtn = document.getElementById('backToAreas');
  let currentTab = 'all';
  let currentCat = 'all';

  function categories() {
    return deck.map(c => c.cat).filter((c, i, a) => a.indexOf(c) === i).sort();
  }

  function setTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === tab);
    });
  }

  // Vista 1: todas as areas visiveis de uma vez.
  function showAreas() {
    areaGrid.hidden = false;
    listView.hidden = true;
    backBtn.hidden = true;
    panelTitle.textContent = '词汇 · Áreas';
    renderAreas();
  }

  // Vista 2: a lista de uma area.
  function showList(cat, tab) {
    currentCat = cat;
    setTab(tab || 'all');
    areaGrid.hidden = true;
    listView.hidden = false;
    backBtn.hidden = false;
    panelTitle.textContent = cat === 'all' ? 'Todas as palavras' : cat;
    renderPanel();
  }

  function renderAreas() {
    areaGrid.innerHTML = '';
    const make = (cat, label, isAll) => {
      const list = isAll ? deck : deck.filter(c => c.cat === cat);
      const known = list.filter(c => progress[c.hanzi] === 'know').length;
      const pct = list.length ? Math.round(known / list.length * 100) : 0;
      const card = document.createElement('button');
      card.className = 'area-card' + (isAll ? ' all' : '');
      card.innerHTML =
        '<div class="area-han">' + (isAll ? '全' : list[0].hanzi.charAt(0)) + '</div>' +
        '<div class="area-name">' + label + '</div>' +
        '<div class="area-count">' + list.length + ' palavras · ' + pct + '% sei</div>' +
        '<div class="area-bar"><i style="width:' + pct + '%"></i></div>';
      card.addEventListener('click', () => showList(cat, 'all'));
      areaGrid.appendChild(card);
    };
    make('all', 'Todas as palavras', true);
    [['A1', 'Teste A1', '试'], ['A2', 'Teste A2', '考']].forEach(([lvl, label, han]) => {
      const total = deck.filter(c => c.lvl === lvl).length;
      const b = document.createElement('button');
      b.className = 'area-card quiz-entry';
      b.innerHTML =
        '<div class="area-han">' + han + '</div>' +
        '<div class="area-name">' + label + '</div>' +
        '<div class="area-count">' + total + ' palavras do nível</div>';
      b.addEventListener('click', () => startQuiz(lvl));
      areaGrid.appendChild(b);
    });
    categories().forEach(cat => make(cat, cat, false));
  }

  function openPanel(mode) {
    panel.classList.add('active');
    if (mode === 'know' || mode === 'review') showList('all', mode);
    else showAreas();
  }

  function closePanel() {
    if (hasSpeech) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }
    panel.classList.remove('active');
  }

  function getList(tab) {
    let list = deck;
    if (tab === 'know') list = deck.filter(c => progress[c.hanzi] === 'know');
    else if (tab === 'review') list = deck.filter(c => progress[c.hanzi] === 'review');
    if (currentCat !== 'all') list = list.filter(c => c.cat === currentCat);
    return list;
  }

  function renderPanel() {
    const list = getList(currentTab);

    // Os contadores seguem a area aberta, nao o baralho inteiro.
    const base = currentCat === 'all' ? deck : deck.filter(c => c.cat === currentCat);
    document.getElementById('countKnow').textContent = base.filter(c => progress[c.hanzi] === 'know').length;
    document.getElementById('countReview').textContent = base.filter(c => progress[c.hanzi] === 'review').length;
    document.getElementById('countAll').textContent = base.length;

    if (list.length === 0) {
      const messages = {
        know: 'Nenhuma palavra marcada como "sei" nesta categoria.',
        review: 'Nada para revisar aqui — você está em dia!',
        all: 'Nenhuma palavra nesta categoria.'
      };
      panelContent.innerHTML = '<div class="empty">' + messages[currentTab] + '</div>';
      return;
    }

    panelContent.innerHTML = '';
    list.forEach(c => {
      const status = progress[c.hanzi] || 'unseen';
      const row = document.createElement('div');
      row.className = 'word-row';
      row.innerHTML =
        '<div class="word-status ' + status + '"></div>' +
        '<div class="word-hanzi">' + c.hanzi + '</div>' +
        '<div class="word-info">' +
          '<div class="word-pinyin">' + c.pinyin + '</div>' +
          '<div class="word-pt">' + c.pt + '</div>' +
        '</div>' +
        '<button class="word-audio" aria-label="Ouvir">♪</button>';

      const audioBtn = row.querySelector('.word-audio');
      audioBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        speak(c.hanzi, audioBtn);
      });

      panelContent.appendChild(row);
    });
  }

  document.getElementById('openMenu').addEventListener('click', () => openPanel('areas'));
  backBtn.addEventListener('click', showAreas);
  document.getElementById('openKnow').addEventListener('click', () => openPanel('know'));
  document.getElementById('openReview').addEventListener('click', () => openPanel('review'));
  document.getElementById('closePanel').addEventListener('click', closePanel);

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      setTab(tab.dataset.tab);
      renderPanel();
    });
  });

  document.getElementById('trainSelected').addEventListener('click', () => {
    const list = getList(currentTab);
    if (list.length === 0) return;
    closePanel();
    startSession(list);
  });

  // ─── Teste de nível (A1 / A2) ───
  const quizEl = document.getElementById('quiz');
  const quizBody = document.getElementById('quizBody');
  const quizResult = document.getElementById('quizResult');
  const quizBar = document.getElementById('quizBar');
  const quizTitle = document.getElementById('quizTitle');
  const QUIZ_SIZE = 15;
  let quizQs = [], quizAt = 0, quizHits = 0, quizMissed = [], quizLevel = 'A1';

  function startQuiz(level) {
    quizLevel = level;
    const pool = deck.filter(c => c.lvl === level);
    if (pool.length < 4) return;
    quizQs = shuffle(pool).slice(0, Math.min(QUIZ_SIZE, pool.length)).map((card, i) => {
      const others = shuffle(pool.filter(x => x.hanzi !== card.hanzi && x.pt !== card.pt)).slice(0, 3);
      return { card: card, askHan: i % 2 === 0, opts: shuffle([card].concat(others)) };
    });
    quizAt = 0; quizHits = 0; quizMissed = [];
    quizTitle.textContent = 'Teste ' + level;
    quizResult.hidden = true;
    quizBody.hidden = false;
    quizEl.classList.add('active');
    renderQuestion();
  }

  function renderQuestion() {
    if (quizAt >= quizQs.length) return finishQuiz();
    const q = quizQs[quizAt];
    quizBar.style.width = (quizAt / quizQs.length * 100) + '%';
    quizBody.innerHTML = '';

    const step = document.createElement('div');
    step.className = 'quiz-step';
    step.textContent = 'Pergunta ' + (quizAt + 1) + ' de ' + quizQs.length;
    quizBody.appendChild(step);

    const ask = document.createElement('div');
    ask.className = 'quiz-ask';
    ask.innerHTML = q.askHan
      ? '<div class="quiz-ask-han">' + q.card.hanzi + '</div><div class="quiz-ask-pin">' + q.card.pinyin + '</div>'
      : '<div class="quiz-ask-pt">' + q.card.pt + '</div>';
    quizBody.appendChild(ask);

    const box = document.createElement('div');
    box.className = 'quiz-opts';
    q.opts.forEach(opt => {
      const b = document.createElement('button');
      b.className = 'quiz-opt';
      b.innerHTML = q.askHan
        ? opt.pt
        : '<span class="han">' + opt.hanzi + '</span> <span style="opacity:.6;font-style:italic">' + opt.pinyin + '</span>';
      b.addEventListener('click', () => answer(b, opt, q));
      box.appendChild(b);
    });
    quizBody.appendChild(box);
  }

  function answer(btn, opt, q) {
    const certo = opt.hanzi === q.card.hanzi;
    quizBody.querySelectorAll('.quiz-opt').forEach(b => { b.disabled = true; });
    btn.classList.add(certo ? 'right' : 'wrong');
    if (certo) {
      quizHits++;
    } else {
      quizMissed.push(q.card);
      // O que errou entra na fila de revisão do baralho.
      markCard(q.card.hanzi, 'review');
      quizBody.querySelectorAll('.quiz-opt').forEach(b => {
        if (b.textContent.indexOf(q.card.hanzi) === 0 || b.textContent === q.card.pt) b.classList.add('right');
      });
    }
    setTimeout(() => { quizAt++; renderQuestion(); }, certo ? 450 : 1100);
  }

  function finishQuiz() {
    quizBar.style.width = '100%';
    const pct = Math.round(quizHits / quizQs.length * 100);
    const veredito = pct >= 85 ? 'Você domina o nível ' + quizLevel
                   : pct >= 60 ? 'Quase lá'
                   : 'Precisa treinar mais';
    quizBody.hidden = true;
    quizResult.hidden = false;
    quizResult.innerHTML =
      '<div class="quiz-score">' + pct + '%</div>' +
      '<div class="quiz-verdict">' + veredito + '</div>' +
      '<div class="quiz-detail">' + quizHits + ' de ' + quizQs.length + ' certas · ' +
        quizMissed.length + ' para revisar</div>' +
      '<div class="quiz-actions">' +
        (quizMissed.length ? '<button class="primary" id="quizTrain">Treinar os erros</button>' : '') +
        '<button id="quizAgain">Refazer o teste</button>' +
        '<button id="quizBack">Voltar às áreas</button>' +
      '</div>';
    const t = document.getElementById('quizTrain');
    if (t) t.addEventListener('click', () => {
      const errs = quizMissed.slice();
      closeQuiz(); closePanel(); startSession(errs);
    });
    document.getElementById('quizAgain').addEventListener('click', () => startQuiz(quizLevel));
    document.getElementById('quizBack').addEventListener('click', closeQuiz);
  }

  function closeQuiz() {
    quizEl.classList.remove('active');
    quizBody.hidden = false;
    quizResult.hidden = true;
    renderAreas();
  }

  document.getElementById('closeQuiz').addEventListener('click', closeQuiz);

  document.getElementById('resetProgress').addEventListener('click', () => {
    if (confirm('Limpar todo o progresso? Esta ação não pode ser desfeita.')) {
      progress = {};
      saveProgress();
      renderPanel();
      if (!areaGrid.hidden) renderAreas();
    }
  });

  render();
</script>
</body>
</html>
